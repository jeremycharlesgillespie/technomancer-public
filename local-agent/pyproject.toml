[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent"
version = "0.1.0"
description = "Ollama-powered autonomous agent with tools for file ops, memory, Obsidian, and Claude escalation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jeremy Gillespie"}
]
keywords = ["ollama", "agent", "ai", "tools", "obsidian", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "discord.py>=2.3.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "yt-dlp>=2024.1.0",
    "feedparser>=6.0.0",
    "flask>=3.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.20.0",
    "python-pptx>=0.6.21",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
claude = [
    "anthropic>=0.39.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
all = [
    "anthropic>=0.39.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-rerunfailures>=14.0",
    "black",
    "ruff",
    "mypy>=1.15.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
local-agent = "agent.cli:main"
obsidian-agent = "agent.obsidian_agent:main"
discord-agent = "agent.discord_bot:main"

[project.urls]
Homepage = "https://github.com/jeremycharlesgillespie/technomancer-public"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "allow_network: permit real network calls in this test",
]

[tool.coverage.run]
source = ["agent"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Discord client modules — require live Discord connection
    "*discord_memory_bot*",
    "*discord_bridge*",
    "*slash_commands*",
    "*user_commands*",
    # Thin wrappers around external CLIs/APIs — no meaningful logic to test
    "*ask_claude*",
    "*claude_bridge*",
    "*youtube_tools*",
    # Has test_pdf_tools_extended.py (different naming convention)
    "*pdf_tools*",
    # Scheduled audit task — runs against live vault/DB data
    "*knowledge_consistency*",
    # Async RSS/Discord digest loop — mostly I/O, tested via unit helpers
    "*news_digest*",
    # Discord command handlers — thin dispatch to other modules
    "*bot_commands*",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    # Defensive clauses that are hard to trigger in tests
    "except ImportError",
    "except Exception:",
    "except Exception as e:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false  # Too noisy for now
warn_unused_ignores = false  # Different mypy versions/envs flag different things
disallow_untyped_defs = false  # Gradual adoption - set to true later
check_untyped_defs = false  # Too strict for gradual adoption
ignore_missing_imports = true  # Third-party libs without stubs
# Disable strict optional checking for now (gradual adoption)
strict_optional = false
# Allow implicit Optional (param: str = None)
implicit_optional = true
